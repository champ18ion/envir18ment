services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4040:4040"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WEB_URL: ${WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: 4040
    restart: unless-stopped
